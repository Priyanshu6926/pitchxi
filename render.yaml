services:
  - type: web
    name: pitchxi-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build --workspace=@pitchxi/shared-types && cd apps/api && npx prisma generate && npx prisma db push && npm run build
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
    healthCheckPath: /health
